[project]
name = "llmio"
version = "0.11.0"
description = "Easily connect large language models into your application"
authors = [{ name = "Peter Leupi" }]
license = "MIT"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "openai>=2.37.0",
    "pydantic>=2.13.4",
]

[project.urls]
Homepage = "https://github.com/badgeir/llmio"
Repository = "https://github.com/badgeir/llmio"
Documentation = "https://github.com/badgeir/llmio"

[dependency-groups]
dev = [
    "black>=26.5.1",
    "ruff>=0.15.14",
    "mypy>=2.1.0",
    "pylint>=4.0.5",
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
include = ["llmio"]

[tool.hatch.build.targets.sdist]
include = ["llmio", "README.md", "LICENSE", "pyproject.toml"]

[tool.pylint]
max-line-length = 120
extension-pkg-allow-list=[
    "pydantic"
]
disable = [
    "missing-module-docstring",
    "missing-class-docstring",
    "missing-function-docstring",
    "too-many-arguments",
    "too-many-locals",
    "too-few-public-methods",
    "too-many-instance-attributes",
    "too-many-positional-arguments",
]

[tool.ruff.lint]
extend-select = ["I"]

[tool.uv]
exclude-newer = "2 weeks"
