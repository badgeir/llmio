[project]
name = "llmio"
version = "0.10.4"
description = "Easily connect large language models into your application"
authors = [{ name = "Peter Leupi" }]
license = "MIT"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "openai>=2.37.0",
    "pydantic>=2.0.0",
    "typing-extensions>=4.12.2",
]

[project.urls]
Homepage = "https://github.com/badgeir/llmio"
Repository = "https://github.com/badgeir/llmio"
Documentation = "https://github.com/badgeir/llmio"

[dependency-groups]
dev = [
    "black>=24.8.0",
    "ruff>=0.6.1",
    "mypy>=1.11.1",
    "pylint>=3.2.6",
    "pytest>=8.3.2",
    "pytest-asyncio>=0.23.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
include = ["llmio"]

[tool.hatch.build.targets.sdist]
include = ["llmio", "README.md", "LICENSE", "pyproject.toml"]

[tool.pylint]
max-line-length = 120
extension-pkg-allow-list=[
    "pydantic"
]
disable = [
    "missing-module-docstring",
    "missing-class-docstring",
    "missing-function-docstring",
    "too-many-arguments",
    "too-many-locals",
    "too-few-public-methods",
    "too-many-instance-attributes",
    "too-many-positional-arguments",
]

[tool.ruff.lint]
extend-select = ["I"]

[tool.uv]
exclude-newer = "2 weeks"
